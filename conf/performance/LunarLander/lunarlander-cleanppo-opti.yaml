# @package _global_
# Changes specified in this config should be interpreted as relative to the _global_ package.
defaults:
  - override /algorithm: cleanppo

eval_after_n_steps: 2000
# The max. number of training epochs to run. One epoch consists of 'eval_after_n_steps' actions.
n_epochs: 100
hyperopt_criterion: 'eval/mean_reward'

hydra:
  sweeper:
    study_name: cleanppo_lunar_lander_env_opti
    max_trials: 10000
    n_jobs: 50
    direction: maximize
    max_duration_minutes: 6000
    min_trials_per_param: 100
    max_trials_per_param: 300
    search_space:
      ++env_kwargs.gravity:
        type: float
        low: -10.0
        high: 0.0
      ++env_kwargs.wind_power:
        type: float
        low: 0.0
        high: 20.0
      ++env_kwargs.turbulence_power:
        type: float
        low: 0.0
        high: 2.0
